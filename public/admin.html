<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>管理中心</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark"><i data-lucide="shield-check"></i></span><span>管理中心</span></div>
      <nav class="nav">
        <button class="active" data-section="overview" title="概览"><i data-lucide="layout-dashboard" class="icon"></i><span>概览</span></button>
        <button data-section="mailboxes" title="母邮箱"><i data-lucide="inbox" class="icon"></i><span>母邮箱</span></button>
        <button data-section="aliases" title="子邮箱"><i data-lucide="at-sign" class="icon"></i><span>子邮箱</span></button>
        <button data-section="messages" title="收信记录"><i data-lucide="mails" class="icon"></i><span>收信记录</span></button>
        <button data-section="security" title="安全"><i data-lucide="key-round" class="icon"></i><span>安全</span></button>
      </nav>
      <div class="sidebar-bottom"><button id="logout" class="btn btn-secondary"><i data-lucide="log-out" class="icon"></i><span>退出登录</span></button></div>
    </aside>
    <div class="admin-main">
      <header class="topbar"><h1 id="page-title">概览</h1><div class="admin-user"><i data-lucide="circle-user-round" class="icon"></i><span id="admin-email"></span></div></header>
      <main class="content">
        <section id="overview" class="section active">
          <div class="section-head"><div><h2>运行概览</h2><p>邮箱同步、验证码归类与查询访问状态。</p></div><button id="refresh" class="btn btn-secondary"><i data-lucide="refresh-cw" class="icon"></i><span>刷新</span></button></div>
          <div id="stats" class="stats"></div>
          <div class="panel"><div class="panel-head"><h3>最近验证码</h3></div><div id="overview-recent" class="table-wrap"></div></div>
          <div class="panel"><div class="panel-head"><h3>最近审计</h3></div><div id="audit-table" class="table-wrap"></div></div>
        </section>
        <section id="mailboxes" class="section">
          <div class="section-head"><div><h2>母邮箱</h2><p>后端使用 App 专用密码连接 iCloud IMAP。</p></div><button id="add-account" class="btn btn-primary"><i data-lucide="plus" class="icon"></i><span>接入母邮箱</span></button></div>
          <div class="panel"><div id="accounts-table" class="table-wrap"></div></div>
        </section>
        <section id="aliases" class="section">
          <div class="section-head"><div><h2>子邮箱</h2><p>管理查询密钥，以及各子邮箱绑定的第三方平台 2FA。</p></div><button id="add-alias" class="btn btn-primary"><i data-lucide="plus" class="icon"></i><span>添加子邮箱</span></button></div>
          <div class="panel"><div id="aliases-table" class="table-wrap"></div></div>
        </section>
        <section id="messages" class="section">
          <div class="section-head"><div><h2>收信记录</h2><p>只保留必要元数据和短期加密验证码，不保存邮件正文。</p></div></div>
          <div class="panel"><div class="panel-head"><h3>已归类邮件</h3></div><div id="messages-table" class="table-wrap"></div></div>
          <div class="panel"><div class="panel-head"><h3>未匹配子邮箱</h3></div><div id="unmatched-table" class="table-wrap"></div></div>
        </section>
        <section id="security" class="section">
          <div class="section-head"><div><h2>安全设置</h2><p>这里的 TOTP 仅保护管理员登录，与子邮箱第三方平台 2FA 分开。</p></div></div>
          <div class="panel"><div class="panel-head"><h3>管理员登录 2FA</h3></div><div class="panel-body"><p id="totp-status" class="muted"></p><button id="setup-totp" class="btn btn-primary"><i data-lucide="scan-line" class="icon"></i><span>启用管理员 TOTP</span></button></div></div>
          <div class="panel"><div class="panel-head"><h3>修改登录密码</h3></div><div class="panel-body"><form id="password-form" class="form-grid"><div class="field"><label for="current-password">当前密码</label><input id="current-password" type="password" autocomplete="current-password" required></div><div class="field"><label for="new-password">新密码</label><input id="new-password" type="password" minlength="8" autocomplete="new-password" required></div><div class="form-actions"><button class="btn btn-primary" type="submit"><i data-lucide="save" class="icon"></i><span>更新密码</span></button></div></form></div></div>
        </section>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/assets/vendor/lucide.js"></script>
  <script src="/assets/admin.js"></script>
</body>
</html>
