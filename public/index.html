<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>验证码查询</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="public-shell">
  <header class="public-head">
    <div class="brand"><span class="brand-mark"><i data-lucide="mail-check"></i></span><span>验证码中心</span></div>
    <span class="muted">安全查询</span>
  </header>
  <main class="public-main">
    <section class="query-tool" aria-labelledby="query-title">
      <h1 id="query-title">验证码查询</h1>
      <div class="query-tabs" role="tablist" aria-label="验证码类型">
        <button id="mail-tab" class="query-tab active" type="button" role="tab" aria-selected="true" aria-controls="mail-panel" data-query-tab="mail"><i data-lucide="mail" class="icon"></i><span>邮箱验证码</span></button>
        <button id="totp-tab" class="query-tab" type="button" role="tab" aria-selected="false" aria-controls="totp-panel" data-query-tab="totp"><i data-lucide="shield-keyhole" class="icon"></i><span>2FA 验证码</span></button>
      </div>

      <section id="mail-panel" class="query-panel active" role="tabpanel" aria-labelledby="mail-tab">
        <p>输入子邮箱查询密钥，只查询该邮箱最新的邮件验证码。</p>
        <form id="mail-query-form">
          <div class="field">
            <label for="mail-token">邮箱验证码查询密钥</label>
            <div class="token-row">
              <input id="mail-token" name="token" type="password" autocomplete="off" minlength="20" required placeholder="cv_...">
              <button class="btn btn-primary" type="submit"><i data-lucide="search" class="icon"></i><span>查询邮箱验证码</span></button>
            </div>
          </div>
          <p id="mail-query-error" class="message" role="alert"></p>
        </form>
        <div id="mail-result" class="result hidden" aria-live="polite"></div>
      </section>

      <section id="totp-panel" class="query-panel" role="tabpanel" aria-labelledby="totp-tab" hidden>
        <p>直接输入第三方平台提供的 Base32 手动密钥或 otpauth 地址，立即转换为 2FA 动态验证码。每个密钥独立保存，互不覆盖。</p>
        <form id="totp-query-form">
          <div class="field">
            <label for="totp-secret">2FA 手动密钥或 otpauth 地址</label>
            <textarea id="totp-secret" name="secret" rows="4" maxlength="4096" autocomplete="off" spellcheck="false" required placeholder="JBSWY3DPEHPK3PXP 或 otpauth://totp/..."></textarea>
          </div>
          <div class="form-grid totp-meta-fields">
            <div class="field"><label for="totp-issuer">平台名称（可选）</label><input id="totp-issuer" maxlength="120" placeholder="例如 GitHub"></div>
            <div class="field"><label for="totp-account-name">账号备注（可选）</label><input id="totp-account-name" maxlength="160" placeholder="例如 user@example.com"></div>
          </div>
          <p id="totp-query-error" class="message" role="alert"></p>
          <div class="form-actions"><button class="btn btn-primary" type="submit"><i data-lucide="key-round" class="icon"></i><span>转换并保存 2FA</span></button></div>
        </form>
        <div id="totp-result" class="result hidden" aria-live="polite"></div>
      </section>
    </section>
  </main>
  <footer class="public-foot">查询结果不会被浏览器或代理缓存。请勿向无关人员透露查询密钥与验证码。</footer>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/assets/vendor/lucide.js"></script>
  <script src="/assets/query.js"></script>
</body>
</html>
